target-version = "py310"
src = ["src"]
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[lint.flake8-bugbear]
# Field objects are intentional metadata in tunable function signatures.
extend-immutable-calls = ["pydantic.Field"]

[lint.per-file-ignores]
"examples/app_generate_schema.py" = ["E402"]
