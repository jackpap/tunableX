name: Python checks

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'examples/**', 'pyproject.toml', 'README.md', '.ruff.toml', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'examples/**', 'pyproject.toml', 'README.md', '.ruff.toml', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install minimum dependencies
        if: matrix.python == '3.10'
        run: python -m pip install -e '.[all]' 'pydantic==2.12.5' 'jsonargparse==4.26.0' 'PyYAML==6.0.1' 'pytest>=8,<9'
      - name: Install development dependencies
        if: matrix.python == '3.14'
        run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Lint, format and package
        if: matrix.python == '3.14'
        run: |
          python -m ruff check src tests examples
          python -m ruff format --check src tests examples
          python -m build
          python -m twine check dist/*
