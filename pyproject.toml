[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tunablex"                # PyPI name (normalized)
version = "0.2.0"                # bump before each release
description = "Function-first tunables with auto JSON/YAML/TOML config & schema, per-executable composition (tags or static analysis), and runtime auto-injection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jacques Papper" },
  { name = "Vincent Drouet", email = "v.drouet@iconcfd.com" }
]
dependencies = ["pydantic>=2.12.5,<3", "tomli>=2; python_version < '3.11'"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
[project.urls]
Homepage = "https://github.com/jackpap/tunableX"
Issues = "https://github.com/jackpap/tunableX/issues"

# Tell Hatch where your package lives (src/ layout)
[tool.hatch.build.targets.wheel]
packages = ["src/tunablex"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "CONTRIBUTING.md", "CONTRIBUTORS.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", ".ruff.toml"]

[project.optional-dependencies]
jsonargparse = ["jsonargparse>=4.26"]
yaml = ["PyYAML>=6.0.1"]
all = ["jsonargparse>=4.26", "PyYAML>=6.0.1"]
# Developer tools and optional runtime integrations
dev = [
  "jsonargparse>=4.26",
  "PyYAML>=6.0.1",
  "ruff>=0.16.3",
  "pytest>=8.0.0",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
tunablex = "tunablex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
